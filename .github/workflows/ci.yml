name: CI

on:
  push:
    branches: [main, soundpush-v0.1]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sound-push-desktop/ui/package-lock.json
      - name: Linux audio and webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libdbus-1-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build UI (embedded by the desktop crate)
        run: |
          npm --prefix sound-push-desktop/ui ci
          npm --prefix sound-push-desktop/ui run build
      - run: cargo fmt --all --check
      # docs/soundpush-final.md §29.3: clippy with warnings as errors. Warnings listed in .github/clippy-allowed.txt
      # (present before the gate) pass until fixed; with an empty list this is exactly -D warnings.
      - name: cargo clippy (no new warnings)
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --message-format=json \
            | node tools/ci/clippy-gate.mjs .github/clippy-allowed.txt
      # Failing test names are raised as annotations, which anyone can read; the job log itself
      # needs admin rights on the repository, so a failure nobody can diagnose is no use.
      - name: cargo test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --exclude sound-push-desktop 2>&1 | tee test-output.txt || {
            grep -E '^(test .* FAILED|---- .* stdout ----)' test-output.txt \
              | sed -E 's/^---- (.*) stdout ----/\1/; s/^test (.*) \.\.\. FAILED/\1/' \
              | sort -u \
              | while read -r name; do echo "::error title=Test failed::$name"; done
            # Where each failure panicked and the message on the line after it, which is usually
            # the whole story.
            grep -E -A1 "panicked at" test-output.txt | grep -v '^--$' | head -10 \
              | while read -r line; do echo "::error title=Test failure::${line:0:400}"; done
            exit 1
          }
      - name: Test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-output-${{ matrix.os }}
          path: test-output.txt
          if-no-files-found: ignore
      # sp-audio-io/tests/pulse_server.rs: speaker muting, per-app capture and device events against a real
      # PulseAudio server. The tests are #[ignore]d without a server and share it, so run them one at a time.
      # The same tests run against PipeWire in the "Audio backend" job.
      - name: PulseAudio server tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --daemonize=yes --exit-idle-time=-1
          for _ in $(seq 20); do pactl info >/dev/null 2>&1 && break; sleep 0.5; done
          pactl info
          cargo test -p sp-audio-io --features pulse --test pulse_server -- --ignored --test-threads=1

  # Backend integration (docs/soundpush-final.md §29.1): the audio backends against the real sound
  # system, not the null backend. PulseAudio has its own step in the Core job above.
  backends:
    name: Audio backend (${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, backend: PipeWire }
          - { os: windows-latest, backend: WASAPI }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: backends-${{ matrix.backend }}
      # PipeWire is what every current desktop Linux ships; SoundPush reaches it through its
      # PulseAudio server, so the PulseAudio tests are the right ones to run against it. Runners have
      # no session, so the daemons are started by hand with a runtime directory and a session bus.
      - name: PipeWire server tests
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev pkg-config dbus-x11 \
            pipewire pipewire-pulse wireplumber pulseaudio-utils
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg"
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          eval "$(dbus-launch --sh-syntax)"
          pipewire &
          sleep 2
          pipewire-pulse &
          wireplumber &
          for _ in $(seq 60); do pactl info >/dev/null 2>&1 && break; sleep 0.5; done
          pactl info | tee "$RUNNER_TEMP/pactl.txt"
          grep -qi pipewire "$RUNNER_TEMP/pactl.txt"
          cargo test -p sp-audio-io --features pulse --test pulse_server -- --ignored --test-threads=1
        env:
          XDG_RUNTIME_DIR: ${{ runner.temp }}/xdg
      # WASAPI enumeration, render and system-audio loopback. A Windows Server runner has no audio
      # endpoint, so the tests that need one say why they stopped and pass; the rest still run.
      - name: WASAPI smoke test
        if: runner.os == 'Windows'
        run: cargo test -p sp-audio-io --test wasapi_smoke -- --nocapture --test-threads=1

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      # §29.3 target "core ≥ 80 % lines". Core = protocol, security, media, transport and discovery logic.
      # Code that only runs against real hardware or a real network (cpal devices, mDNS sockets) is excluded
      # from the gate; the engine and FFI are reported but not gated yet.
      CORE_MIN_LINES: 80
      CORE_IGNORE: "sp-engine/|sp-ffi/|sp-audio-io/|sp-testkit/|tools/|sp-discovery/src/(mdns|service)\\.rs"
      ENGINE_IGNORE: "sp-(protocol|security|media|transport|discovery|ffi|audio-io|testkit)/|tools/"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Linux audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev pkg-config
      - name: Tests with coverage
        run: |
          cargo llvm-cov --workspace --no-report \
            --exclude sound-push-desktop --exclude soundpush-soak \
            --exclude soundpush-netsim --exclude soundpush-latency-probe
      - name: Reports (lcov, HTML, job summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          cp lcov.info coverage/
          {
            echo "## Coverage"
            echo
            echo '```'
            cargo llvm-cov report --summary-only | awk '$1 != "" && $1 !~ /^-+$/ { printf "%-60s %s\n", $1, $10 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
      - name: Engine coverage (reported, not gated)
        run: |
          lines=$(cargo llvm-cov report --summary-only --ignore-filename-regex "$ENGINE_IGNORE" | awk '/^TOTAL/ { print $10 }')
          echo "sp-engine line coverage: $lines" | tee -a "$GITHUB_STEP_SUMMARY"
          if awk -v v="${lines%\%}" 'BEGIN { exit !(v < 80) }'; then
            echo "::warning title=Coverage::sp-engine line coverage is $lines (plan target 80 %)."
          fi
      - name: Core coverage gate (≥ ${{ env.CORE_MIN_LINES }} % lines)
        run: cargo llvm-cov report --summary-only --ignore-filename-regex "$CORE_IGNORE" --fail-under-lines "$CORE_MIN_LINES"

  desktop-e2e:
    name: Desktop e2e (mocked engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for the e2e suite
        id: suite
        run: |
          if node -e "process.exit(require('./sound-push-desktop/ui/package.json').scripts?.['test:e2e'] ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Desktop e2e::sound-push-desktop/ui has no test:e2e script yet; nothing to run."
          fi
      - uses: actions/setup-node@v4
        if: steps.suite.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sound-push-desktop/ui/package-lock.json
      - name: Install
        if: steps.suite.outputs.present == 'true'
        working-directory: sound-push-desktop/ui
        run: |
          node ../../design/scripts/generate.mjs
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        if: steps.suite.outputs.present == 'true'
        working-directory: sound-push-desktop/ui
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.suite.outputs.present == 'true'
        with:
          name: desktop-e2e-report
          path: |
            sound-push-desktop/ui/playwright-report
            sound-push-desktop/ui/test-results
          if-no-files-found: ignore

  release-tools:
    name: Release tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tools/release/*.test.mjs tools/ci/*.test.mjs
      # No signing key, password or token reaches this public repository (tools/ci/no-secrets.mjs).
      - run: node tools/ci/no-secrets.mjs

  desktop-ui:
    name: Desktop UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sound-push-desktop/ui/package-lock.json
      - run: node design/scripts/generate.mjs
      - run: npm --prefix sound-push-desktop/ui ci
      # §29.3: eslint and prettier alongside svelte-check. `npm run format` fixes what it reports.
      - run: npm --prefix sound-push-desktop/ui run lint
      - run: npm --prefix sound-push-desktop/ui run check
      - run: npm --prefix sound-push-desktop/ui test
      - run: npm --prefix sound-push-desktop/ui run build
      - name: npm audit (high and critical advisories)
        run: npm --prefix sound-push-desktop/ui audit --audit-level=high --omit=dev

  dependencies:
    name: Rust dependencies (licences, advisories, bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # deny.toml: GPL-3.0-compatible licences, RustSec advisories, dependency direction, crates.io only.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: ./.github/actions/android-sdk
        with:
          ndk: 27.2.12479018
      - uses: gradle/actions/setup-gradle@v6
      - run: cargo install cargo-ndk --locked
      # The host build of sp-ffi (needed to generate the Kotlin bindings) links cpal, whose Linux
      # backend builds alsa-sys: without libasound2-dev and pkg-config its build script fails (exit 101).
      - name: Host audio libraries for the binding build
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config
      - name: Kotlin bindings and native libraries
        run: |
          cargo build -p sp-ffi
          cargo run -q -p sp-ffi --bin uniffi-bindgen -- generate --library target/debug/libsoundpush_ffi.so --language kotlin --out-dir sound-push-mobile/android/core-engine/src/main/java --no-format
          ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018 cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 26 -o sound-push-mobile/android/core-engine/src/main/jniLibs build -p sp-ffi --release
      # §29.3: ktlint alongside the Android lint and the unit tests. `bundleDebug` proves the App
      # Bundle the release workflow ships still builds. Gradle verifies every dependency against
      # gradle/verification-metadata.xml on the way (§31); `just mobile-verification` regenerates it.
      - name: Build, test and lint
        working-directory: sound-push-mobile/android
        run: ./gradlew assembleDebug bundleDebug testDebugUnitTest lint ktlintCheck --console=plain
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            sound-push-mobile/android/*/build/reports
          if-no-files-found: ignore
