name: Windows build

# Builds the SoundPush desktop installer for Windows (x64 and ARM64) and uploads each as an
# artifact. Runs on every push; can also be started from the Actions tab ("Run workflow").
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]

jobs:
  windows:
    name: Windows installer (${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          # Cross-compiled on the x64 runner (MSVC ARM64 build tools are preinstalled).
          - arch: arm64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sound-push-desktop/ui/package-lock.json

      # `ring` (TLS) builds its ARM64 assembly with clang, which the runner ships with LLVM.
      - name: Put clang on PATH (ARM64)
        if: matrix.arch == 'arm64'
        run: echo "C:\Program Files\LLVM\bin" >> "$GITHUB_PATH"

      - name: Install UI dependencies
        run: npm --prefix sound-push-desktop/ui ci

      # Failures are surfaced as annotations (readable without downloading logs),
      # and do not block the installer build below. ARM64 binaries can't run on the x64 runner.
      - name: Test core on Windows
        if: matrix.arch == 'x64'
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test -p sp-protocol -p sp-security -p sp-media -p sp-transport -p sp-engine -p sp-audio-io 2>&1 | tee test.log || {
            grep -E "^error|error\[|panicked|FAILED|^---- " test.log | head -40 | sed 's/^/::error title=Core tests::/'
            exit 1
          }

      - name: Build installer
        working-directory: sound-push-desktop
        run: |
          set -o pipefail
          ./ui/node_modules/.bin/tauri build --bundles nsis --target ${{ matrix.target }} 2>&1 | tee ../build.log || {
            grep -E "^error|error\[| --> |warning: unused" ../build.log | head -40 | sed 's/^/::error title=Build (${{ matrix.arch }})::/'
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SoundPush-Windows-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
