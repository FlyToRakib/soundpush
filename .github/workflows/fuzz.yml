name: Fuzz

# Nightly fuzzing of every cargo-fuzz target in fuzz/ (docs/soundpush-final.md §29.1: 30 min per target).
# The corpus grows across runs through the Actions cache; seed files committed under fuzz/corpus/<target>
# are used as well. A crash fails the job and uploads the crashing input as an artifact:
#   cargo +$NIGHTLY fuzz run <target> <downloaded-file>   reproduces it locally (NIGHTLY is below).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        type: number
        default: 1800
      target:
        description: One target name, or empty for all
        type: string
        default: ""

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Both halves of the fuzzing toolchain are pinned. cargo-fuzz is not in taiki-e/install-action's
  # manifest, so `tool: cargo-fuzz` fell through to its cargo-binstall fallback and picked up
  # whatever version was current that night, on top of whatever rustup was serving as `nightly`:
  # a job that re-installs its own compiler every night eventually breaks for reasons that have
  # nothing to do with the code under test, and it breaks all six targets at once. Bump this pair
  # as a reviewed change, after `cd fuzz && cargo +<nightly> fuzz build` (no target name: builds
  # every target) succeeds locally.
  NIGHTLY: nightly-2026-09-16
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  targets:
    name: List targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        env:
          ONLY: ${{ inputs.target }}
        run: |
          targets=$(ls fuzz/fuzz_targets/*.rs | xargs -n1 basename | sed 's/\.rs$//')
          if [ -n "$ONLY" ]; then
            echo "$targets" | grep -qx "$ONLY" || { echo "::error title=Fuzz::Unknown target $ONLY (have: $(echo $targets))"; exit 1; }
            targets="$ONLY"
          fi
          echo "targets=$(echo "$targets" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    env:
      TARGET: ${{ matrix.target }}
      SECONDS_PER_TARGET: ${{ inputs.seconds || 1800 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.NIGHTLY }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          # rust-toolchain.toml pins the repository to stable, so that — not the nightly the
          # fuzzers are built with — is what rust-cache hashes into its key. Name the nightly here
          # so bumping it starts from a clean fuzz/target instead of one built by another compiler.
          key: fuzz-${{ env.NIGHTLY }}
      # cargo-fuzz built from its own lockfile with the same nightly: reproducible, and cached in
      # ~/.cargo/bin by the step above, so later runs find it already installed and skip the build.
      - name: Install cargo-fuzz ${{ env.CARGO_FUZZ_VERSION }}
        run: cargo "+$NIGHTLY" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # Built separately from the fuzzing run so the log says which of the two broke: a red "Build"
      # is the toolchain, a red "Fuzz" is a finding.
      # Every cargo call needs the explicit +toolchain: cargo-fuzz runs from the repository root,
      # where rust-toolchain.toml would otherwise select stable, which rejects the -Z sanitizer
      # flags cargo-fuzz builds with.
      - name: Build ${{ matrix.target }}
        run: cargo "+$NIGHTLY" fuzz build "$TARGET"
      - name: Fuzz
        run: |
          mkdir -p "fuzz/corpus/$TARGET"
          cargo "+$NIGHTLY" fuzz run "$TARGET" "fuzz/corpus/$TARGET" -- \
            -max_total_time="$SECONDS_PER_TARGET" -rss_limit_mb=4096 -timeout=10
      - name: Shrink the corpus
        if: success()
        run: cargo "+$NIGHTLY" fuzz cmin "$TARGET" "fuzz/corpus/$TARGET"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
