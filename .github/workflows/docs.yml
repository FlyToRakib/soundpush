name: Docs

# Builds the documentation site (mkdocs.yml, MkDocs Material) and publishes it to GitHub Pages from main:
# https://flytorakib.github.io/soundpush/
# Pull requests only build it (strict: broken links and missing snippets fail).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - PRIVACY.md
      - mkdocs.yml
      - tools/docs/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - PRIVACY.md
      - mkdocs.yml
      - tools/docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - run: pip install -r tools/docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
