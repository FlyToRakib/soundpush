name: Docs

# Builds the documentation site (mkdocs.yml, MkDocs Material) and publishes it to GitHub Pages from main:
# https://flytorakib.github.io/soundpush/
# Pull requests only build it (strict: broken links and missing snippets fail).
# One-time setup: repository Settings → Pages → Source: "GitHub Actions". Until an admin has done
# that, deploying cannot work, so the "GitHub Pages status" job asks the API first and skips the
# deployment with a visible notice instead of failing the run on a setting we cannot change.
# The site is always built and uploaded as the `github-pages` artifact, published or not.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - PRIVACY.md
      - mkdocs.yml
      - tools/docs/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - PRIVACY.md
      - mkdocs.yml
      - tools/docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - run: pip install -r tools/docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    name: GitHub Pages status
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      # GET /repos/{owner}/{repo}/pages answers 404 while Pages has never been switched on, and
      # reports build_type "legacy" when it publishes from a branch instead of from Actions. In both
      # cases actions/deploy-pages can only fail ("Creating Pages deployment failed"), so say what is
      # missing and skip. Any other answer (no permission, API trouble) is a real failure: fail here
      # rather than quietly skipping a deployment that should have happened.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages")
          case "$status" in
            200)
              build_type=$(jq -r '.build_type // "null"' pages.json)
              if [ "$build_type" = "workflow" ]; then
                echo "configured=true" >> "$GITHUB_OUTPUT"
                echo "::notice title=Docs::GitHub Pages builds from Actions; publishing to $(jq -r '.html_url' pages.json)."
                exit 0
              fi
              reason="GitHub Pages is enabled for this repository, but its source is \"$build_type\" (a branch) rather than GitHub Actions."
              ;;
            404)
              reason="GitHub Pages is not enabled for this repository."
              ;;
            *)
              echo "::error title=Docs::Could not read the Pages configuration of $GITHUB_REPOSITORY (HTTP $status)."
              cat pages.json
              echo
              exit 1
              ;;
          esac
          echo "configured=false" >> "$GITHUB_OUTPUT"
          echo "::warning title=Docs::$reason The site was built and uploaded, but cannot be published until an admin sets Settings → Pages → Source to \"GitHub Actions\"."
          {
            echo "## Documentation site built but not published"
            echo
            echo "$reason"
            echo
            echo "The site passed \`mkdocs build --strict\` and is attached to this run as the \`github-pages\` artifact."
            echo "Publishing needs one manual change by a repository admin:"
            echo
            echo "1. Open <$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/pages>."
            echo "2. Under **Build and deployment**, set **Source** to **GitHub Actions**."
            echo "3. Re-run this workflow (or push to \`main\`) — the deployment then runs on its own."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish to GitHub Pages
    needs: [build, pages]
    # Only when Pages really is configured; a deployment that fails from here on is a genuine failure.
    if: needs.pages.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
