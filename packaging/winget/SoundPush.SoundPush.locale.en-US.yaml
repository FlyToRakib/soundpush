ShortDescription: Use your phone as a speaker, microphone or headset for your computer
Description: |-
  SoundPush streams audio between your computer and your Android phone over Wi-Fi or USB.
  Listen to your computer on your phone, use the phone as a microphone in any app (through VB-CABLE on Windows),
  use it as a headset, or play phone audio on the computer. Pairing is by QR code, and audio is encrypted end to end.
  Free and open source, with no accounts, ads or tracking.
