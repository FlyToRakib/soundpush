[package]
name = "sound-push-desktop"
description = "SoundPush desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sp-engine = { path = "../../sound-push-core/sp-engine" }
sp-audio-io = { path = "../../sound-push-core/sp-audio-io", features = ["cpal-backend", "pulse"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# Signed in-app updates (minisign key, no paid certificate) and relaunch after installing.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
dirs = "6"
gethostname = "0.5"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
rand = "0.8"
# Local minidumps for crashes the Rust panic hook cannot see (crash_dump.rs, plan §13.2).
# Nothing is uploaded: `minidumper`'s out-of-process monitor would mean a second SoundPush
# process running at all times, which is not worth it for a report we only store.
crash-handler = "0.8"
minidump-writer = "0.13"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.58"
windows = { version = "0.58", features = [
    "implement",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_Networking_NetworkListManager",
    "Win32_Networking_WinSock",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Recovery",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

# Network changes (rtnetlink), sleep and wake (logind) and tray detection (StatusNotifierWatcher).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
dbus = "0.9"

# macOS permission checks (AVFoundation, TCC), Core Audio device notifications, and the login
# item (ServiceManagement; libc reads the login time).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[lints]
workspace = true
