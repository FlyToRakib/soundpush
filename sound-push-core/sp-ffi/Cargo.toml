[package]
name = "sp-ffi"
description = "SoundPush engine bindings for Android (Kotlin) and iOS (Swift) via UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "soundpush_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
sp-engine = { path = "../sp-engine" }
sp-audio-io = { path = "../sp-audio-io", features = ["cpal-backend"] }
uniffi = { version = "0.29", features = ["cli"] }
serde_json = "1"
thiserror = "2"
pollster = "0.4"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
log = "0.4"
# Hand the JavaVM and app Context to cpal's AAudio backend.
jni = "0.21"
ndk-context = "0.1"

[lints]
workspace = true
