[package]
name = "sp-security"
description = "SoundPush device identity, pairing, trust store and permissions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8", "zeroize"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
chacha20poly1305 = "0.10"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
x509-parser = "0.16"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
