[package]
name = "sp-engine"
description = "SoundPush engine: devices, pairing, sessions, routes, reconnection, settings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sp-protocol = { path = "../sp-protocol" }
sp-security = { path = "../sp-security" }
sp-transport = { path = "../sp-transport" }
sp-discovery = { path = "../sp-discovery" }
sp-media = { path = "../sp-media" }
sp-audio-io = { path = "../sp-audio-io", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
bytes = "1"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# Log files with size rotation and a runtime level switch (logging.rs).
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
if-addrs = "0.13"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tracing-subscriber = "0.3"

[lints]
workspace = true
