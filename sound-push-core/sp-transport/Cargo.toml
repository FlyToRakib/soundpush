[package]
name = "sp-transport"
description = "SoundPush secure transport: QUIC with key-pinned mutual TLS, control stream and media datagrams"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sp-protocol = { path = "../sp-protocol" }
sp-security = { path = "../sp-security" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"

[lints]
workspace = true
