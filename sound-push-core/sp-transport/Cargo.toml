[package]
name = "sp-transport"
description = "SoundPush secure transport: QUIC with key-pinned mutual TLS, control stream and media datagrams"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
sp-protocol = { path = "../sp-protocol" }
sp-security = { path = "../sp-security" }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# TLS over TCP for USB via adb reverse; ring only, like quinn (no aws-lc cross-compilation).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
bytes = "1"
socket2 = "0.5"
thiserror = "2"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
# qWAVE: DSCP marking of media flows (qos.rs).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }

[lints]
workspace = true
